<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="lens-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    :root { color: #18181b; }
    @media (prefers-color-scheme: dark) { :root { color: #e8e8e6; } }
  </style>
  <circle cx="50" cy="50" r="38" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="30" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="22" fill="none" stroke="currentColor" stroke-width="4"/>
  <circle cx="50" cy="50" r="10" fill="#c8f04a" filter="url(#lens-glow)"/>
</svg>
